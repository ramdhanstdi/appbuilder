<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Builder — Tim Multi-Agent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f1117; --panel: #161a23; --panel2: #1c2130; --border: #2a3040;
    --text: #e6e9f0; --muted: #8b93a7; --accent: #6c8cff; --green: #4ade80;
    --red: #f87171; --amber: #fbbf24;
    --c-pm: #6c8cff; --c-ba: #c084fc; --c-frontend: #f472b6; --c-backend: #fb923c; --c-qa: #4ade80;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; }
  #session-picker {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; max-width: 280px; outline: none;
    cursor: pointer;
  }
  #new-session {
    background: transparent; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  #new-session:hover { border-color: var(--accent); color: var(--accent); }
  #status {
    font-size: 12px; color: var(--muted); margin-left: auto;
    display: flex; align-items: center; gap: 6px;
  }
  #status::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); display: inline-block; flex-shrink: 0;
  }
  #status.online::before { background: var(--green); }
  #status.working::before { background: var(--amber); animation: pulse 1s infinite; }
  #status.question::before { background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }

  main { flex: 1; display: flex; min-height: 0; }
  #chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  #tabs { display: flex; gap: 4px; padding: 8px 12px 0; background: var(--panel); border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tab {
    padding: 8px 14px; font-size: 13px; cursor: pointer; border-radius: 8px 8px 0 0;
    color: var(--muted); border: 1px solid transparent; border-bottom: none;
    display: flex; align-items: center; gap: 6px; white-space: nowrap; position: relative;
    background: transparent; user-select: none;
  }
  .tab.active { background: var(--bg); border-color: var(--border); color: var(--text); }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tabcolor, var(--muted)); }
  .tab .badge {
    min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--red);
    color: #fff; font-size: 10px; font-weight: 700; display: none;
    align-items: center; justify-content: center;
  }
  .tab.unread .badge { display: inline-flex; }
  .tab.busy .dot { animation: pulse 0.8s infinite; }

  .pane { flex: 1; overflow-y: auto; padding: 18px; display: none; flex-direction: column; gap: 10px; }
  .pane.active { display: flex; }

  .msg { max-width: 82%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.agent { align-self: flex-start; background: var(--panel2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.task { align-self: flex-start; background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.4); }
  .msg.report { align-self: flex-start; background: rgba(74,222,128,0.07); border: 1px solid rgba(74,222,128,0.35); }
  .msg.question { align-self: flex-start; background: rgba(108,140,255,0.12); border: 1px solid var(--accent); }
  .msg.error { align-self: flex-start; background: rgba(248,113,113,0.1); border: 1px solid var(--red); color: var(--red); }
  .msg.peer-in { align-self: flex-start; background: rgba(192,132,252,0.09); border: 1px solid rgba(192,132,252,0.45); }
  .msg.peer-reply { align-self: flex-start; background: rgba(244,114,182,0.08); border: 1px solid rgba(244,114,182,0.4); }
  .msg.peer-in .label, .msg.peer-reply .label { color: #c084fc; }
  .msg .label { display: block; font-size: 10px; font-weight: 700; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
  .msg.question .label { color: var(--accent); }
  .msg.task .label { color: var(--amber); }
  .msg.report .label { color: var(--green); }

  .activity {
    align-self: flex-start; font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 12px; color: var(--muted); padding: 3px 10px;
    border-left: 2px solid var(--border); max-width: 90%; overflow-wrap: break-word;
  }
  .activity.ok { border-left-color: var(--green); }
  .activity.fail { border-left-color: var(--red); color: var(--red); }
  .activity.call { border-left-color: var(--amber); }

  #input-bar { display: flex; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--border); background: var(--panel); align-items: flex-end; }
  #input-hint { font-size: 11px; color: var(--muted); padding: 0 18px 10px; background: var(--panel); }
  #input {
    flex: 1; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 11px 14px; font-size: 14px; outline: none; resize: none;
    font-family: inherit; max-height: 140px;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 11px 22px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #send:disabled { opacity: 0.4; cursor: not-allowed; }

  #metrics-bar {
    display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
    padding: 7px 18px; border-top: 1px solid var(--border); background: var(--panel);
    font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px;
    color: var(--muted);
  }
  #metrics-bar .m-val { color: var(--text); font-weight: 600; }
  #metrics-bar .m-cost { color: var(--amber); font-weight: 600; }

  #files-col { width: 280px; border-left: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; }
  #files-col h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); padding: 14px 16px 8px; }
  #file-tree { flex: 1; overflow-y: auto; padding: 0 16px 16px; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; line-height: 1.9; }
  .ft-dir { color: var(--accent); }
  .ft-file { color: var(--text); }
  .ft-empty { color: var(--muted); font-style: italic; }
  @media (max-width: 900px) { #files-col { display: none; } }
</style>
</head>
<body>
  <header>
    <h1 id="app-title">🤖 App Builder</h1>
    <select id="session-picker" title=""></select>
    <button id="new-session" title=""></button>
    <span id="status"></span>
  </header>
  <main>
    <div id="chat-col">
      <div id="tabs"></div>
      <div id="panes" style="flex:1; display:flex; flex-direction:column; min-height:0;"></div>
      <div id="input-bar">
        <textarea id="input" rows="1"></textarea>
        <button id="send"></button>
      </div>
      <div id="input-hint"></div>
      <div id="metrics-bar">
        <span><span id="m-tokens-label"></span> <span class="m-val" id="m-tokens">0</span></span>
        <span><span id="m-cost-label"></span> <span class="m-cost" id="m-cost">$0.0000</span></span>
        <span><span id="m-time-label"></span> <span class="m-val" id="m-time">0.0s</span></span>
        <span><span id="m-calls-label"></span> <span class="m-val" id="m-calls">0</span></span>
      </div>
    </div>
    <div id="files-col">
      <h2 id="files-title">📁 Workspace</h2>
      <div id="file-tree"></div>
    </div>
  </main>

<script>
  // ---------------------------------------------------------------------------
  // Interface strings. The server emits {type:"language", code:"<iso>"} whenever the
  // session language changes; unmapped languages fall back to English. Agent prose
  // arrives already in the session language — only this chrome is translated here.
  // ---------------------------------------------------------------------------
  const I18N = {
    id: {
      title: "🤖 App Builder — Tim Multi-Agent",
      connecting: "menghubungkan…",
      ready: "siap",
      teamWorking: "Tim sedang bekerja…",
      agentWorking: (n) => `${n} sedang bekerja…`,
      waitingAnswer: "menunggu jawabanmu",
      disconnected: "terputus — menyambung ulang…",
      placeholder: "Beri perintah ke Project Manager…",
      send: "Kirim",
      hint: "Kamu hanya berbicara dengan PM — dia yang mengatur seluruh tim. Tab lain untuk memantau kerja tiap agent.",
      filesTitle: "📁 Workspace",
      filesEmpty: "Belum ada file.",
      labelTask: "📥 Tugas dari PM",
      labelPeerIn: (n) => `💬 Pesan dari ${n}`,
      labelPeerReply: (n) => `💬 Balasan dari ${n}`,
      labelReport: "📤 Laporan spesialis",
      labelQuestion: "PM bertanya — jawab di bawah",
      retry: "mencoba ulang…",
      errorPrefix: "Terjadi masalah saat eksekusi: ",
      newSession: "＋ Proyek baru",
      newSessionTitle: "Mulai sesi baru (sesi ini tetap tersimpan)",
      sessionPickerTitle: "Buka kembali proyek yang tersimpan",
      untitled: "(tanpa judul)",
      restored: "Sesi dipulihkan — lanjutkan dari sini.",
      mTokens: "token:", mCost: "estimasi biaya:", mTime: "waktu:", mCalls: "panggilan LLM:",
      actions: {
        write_file: (t) => `menulis file: ${t}`,
        read_file: (t) => `membaca file: ${t}`,
        list_files: (t) => `melihat struktur: ${t}`,
        run_command: (t) => `menjalankan: ${t}`,
        ask_user: () => "bertanya ke user",
        assign_task: (t) => `menugaskan ${t}`,
        discuss_with: (t) => `berdiskusi dengan ${t}`,
        set_language: (t) => `mengunci bahasa jawaban: ${t}`,
      },
    },
    en: {
      title: "🤖 App Builder — Multi-Agent Team",
      connecting: "connecting…",
      ready: "ready",
      teamWorking: "The team is working…",
      agentWorking: (n) => `${n} is working…`,
      waitingAnswer: "waiting for your answer",
      disconnected: "disconnected — reconnecting…",
      placeholder: "Tell the Project Manager what to build…",
      send: "Send",
      hint: "You only talk to the PM — they coordinate the whole team. The other tabs let you watch each agent work.",
      filesTitle: "📁 Workspace",
      filesEmpty: "No files yet.",
      labelTask: "📥 Task from PM",
      labelPeerIn: (n) => `💬 Message from ${n}`,
      labelPeerReply: (n) => `💬 Reply from ${n}`,
      labelReport: "📤 Specialist report",
      labelQuestion: "The PM is asking — answer below",
      retry: "retrying…",
      errorPrefix: "Something went wrong during execution: ",
      newSession: "＋ New project",
      newSessionTitle: "Start a new session (this one stays saved)",
      sessionPickerTitle: "Reopen a saved project",
      untitled: "(untitled)",
      restored: "Session restored — pick up where you left off.",
      mTokens: "tokens:", mCost: "est. cost:", mTime: "elapsed:", mCalls: "LLM calls:",
      actions: {
        write_file: (t) => `writing file: ${t}`,
        read_file: (t) => `reading file: ${t}`,
        list_files: (t) => `listing: ${t}`,
        run_command: (t) => `running: ${t}`,
        ask_user: () => "asking the user",
        assign_task: (t) => `assigning ${t}`,
        discuss_with: (t) => `discussing with ${t}`,
        set_language: (t) => `pinning response language: ${t}`,
      },
    },
  };

  let lang = I18N.id;

  const tabsEl = document.getElementById("tabs");
  const panesEl = document.getElementById("panes");
  const inputEl = document.getElementById("input");
  const sendEl = document.getElementById("send");
  const statusEl = document.getElementById("status");
  const treeEl = document.getElementById("file-tree");
  const pickerEl = document.getElementById("session-picker");
  const newSessionEl = document.getElementById("new-session");

  const TID_KEY = "appbuilder.thread_id";

  let ws = null;
  let busy = false;
  let agentsInfo = {};   // key -> {name, emoji}
  let activeTab = "pm";
  let sessionThreadId = null;   // set from the "session" event; scopes the file tree
  // The thread we ask the server to resume. Persisted so closing the app and reopening
  // continues the same session; null means "start a new one".
  let currentThreadId = localStorage.getItem(TID_KEY) || null;
  let replaying = false;        // true while the server is replaying a saved conversation
  let reconnectTimer = null;

  function setStatus(cls, text) { statusEl.className = cls; statusEl.textContent = text; }

  function applyLanguage(code) {
    lang = I18N[(code || "").toLowerCase()] || I18N.en;
    document.documentElement.lang = code || "en";
    document.getElementById("app-title").textContent = lang.title;
    document.title = lang.title.replace(/^\S+\s/, "");
    document.getElementById("files-title").textContent = lang.filesTitle;
    inputEl.placeholder = lang.placeholder;
    sendEl.textContent = lang.send;
    document.getElementById("input-hint").textContent = lang.hint;
    document.getElementById("m-tokens-label").textContent = lang.mTokens;
    document.getElementById("m-cost-label").textContent = lang.mCost;
    document.getElementById("m-time-label").textContent = lang.mTime;
    document.getElementById("m-calls-label").textContent = lang.mCalls;
    newSessionEl.textContent = lang.newSession;
    newSessionEl.title = lang.newSessionTitle;
    pickerEl.title = lang.sessionPickerTitle;
    if (statusEl.className === "online" || !statusEl.textContent) {
      setStatus(statusEl.className, lang.ready);
    }
    if (!treeEl.children.length || treeEl.querySelector(".ft-empty")) {
      treeEl.innerHTML = `<div class="ft-empty">${lang.filesEmpty}</div>`;
    }
  }

  // --- live run metrics ------------------------------------------------------
  let runStartedAt = null;
  let elapsedTimer = null;

  function renderElapsed() {
    if (runStartedAt === null) return;
    const seconds = (performance.now() - runStartedAt) / 1000;
    document.getElementById("m-time").textContent = seconds.toFixed(1) + "s";
  }

  function startElapsed() {
    if (replaying) return;
    runStartedAt = performance.now();
    clearInterval(elapsedTimer);
    elapsedTimer = setInterval(renderElapsed, 200);
    renderElapsed();
  }

  function stopElapsed() {
    clearInterval(elapsedTimer);
    elapsedTimer = null;
    renderElapsed();
  }

  // metricsBase carries the session's cumulative totals restored from earlier runs (across
  // restarts); liveTotals is this connection's running total. The footer shows the sum, so
  // continuing a saved session keeps counting from where it left off.
  let metricsBase = {};
  let liveTotals = {};

  function setMetricsBase(base) {
    metricsBase = base || {};
    renderMetrics(liveTotals);
  }

  function renderMetrics(totals) {
    if (totals) liveTotals = totals;
    const tokens = (metricsBase.total_tokens || 0) + (liveTotals.total_tokens || 0);
    const cost = (metricsBase.cost_usd || 0) + (liveTotals.cost_usd || 0);
    const calls = (metricsBase.llm_calls || 0) + (liveTotals.llm_calls || 0);
    const retries = (metricsBase.retries || 0) + (liveTotals.retries || 0);
    document.getElementById("m-tokens").textContent = tokens.toLocaleString();
    document.getElementById("m-cost").textContent = "$" + cost.toFixed(4);
    document.getElementById("m-calls").textContent = calls + (retries ? ` (${retries}↻)` : "");
  }

  /** Render a structured tool-call payload from the server in the session language. */
  function renderAction(detail, fallbackName) {
    if (!detail) return fallbackName || "";
    if (typeof detail === "string") return detail;   // tolerate older payloads
    const fn = lang.actions[detail.action];
    if (!fn) return detail.action || fallbackName || "";
    return fn(detail.target_name || detail.target || "?");
  }

  function setBusy(b) {
    busy = b;
    sendEl.disabled = b;
    inputEl.disabled = b;
    if (!b) inputEl.focus();
  }

  function buildTabs(agents) {
    tabsEl.innerHTML = ""; panesEl.innerHTML = "";
    for (const a of agents) {
      agentsInfo[a.key] = a;
      const tab = document.createElement("div");
      tab.className = "tab" + (a.key === activeTab ? " active" : "");
      tab.id = "tab-" + a.key;
      tab.style.setProperty("--tabcolor", `var(--c-${a.key})`);
      tab.innerHTML = `<span class="dot"></span>${a.emoji} ${a.name}<span class="badge">0</span>`;
      tab.onclick = () => switchTab(a.key);
      tabsEl.appendChild(tab);

      const pane = document.createElement("div");
      pane.className = "pane" + (a.key === activeTab ? " active" : "");
      pane.id = "pane-" + a.key;
      panesEl.appendChild(pane);
    }
  }

  function switchTab(key) {
    activeTab = key;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.id === "tab-" + key));
    document.querySelectorAll(".pane").forEach(p => p.classList.toggle("active", p.id === "pane-" + key));
    const tab = document.getElementById("tab-" + key);
    tab.classList.remove("unread");
    tab.querySelector(".badge").textContent = "0";
    const pane = document.getElementById("pane-" + key);
    pane.scrollTop = pane.scrollHeight;
  }

  function notify(agentKey) {
    if (replaying) return;   // replayed history should not raise unread badges
    if (agentKey === activeTab) return;
    const tab = document.getElementById("tab-" + agentKey);
    if (!tab) return;
    const badge = tab.querySelector(".badge");
    badge.textContent = Math.min(99, (parseInt(badge.textContent) || 0) + 1);
    tab.classList.add("unread");
  }

  function markBusy(agentKey) {
    if (replaying) return;   // don't animate tabs while reconstructing past activity
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("busy"));
    if (agentKey) {
      const tab = document.getElementById("tab-" + agentKey);
      if (tab) tab.classList.add("busy");
      const info = agentsInfo[agentKey];
      if (info) setStatus("working", lang.agentWorking(info.name));
    }
  }

  function paneOf(agentKey) {
    return document.getElementById("pane-" + agentKey) || document.getElementById("pane-pm");
  }

  function addMsg(agentKey, cls, text, label) {
    const pane = paneOf(agentKey);
    const div = document.createElement("div");
    div.className = "msg " + cls;
    if (label) {
      const l = document.createElement("span");
      l.className = "label"; l.textContent = label;
      div.appendChild(l);
    }
    div.appendChild(document.createTextNode(text));
    pane.appendChild(div);
    pane.scrollTop = pane.scrollHeight;
    notify(agentKey);
  }

  function addActivity(agentKey, cls, text) {
    const pane = paneOf(agentKey);
    const div = document.createElement("div");
    div.className = "activity " + cls;
    div.textContent = text;
    pane.appendChild(div);
    pane.scrollTop = pane.scrollHeight;
    notify(agentKey);
  }

  async function refreshFiles() {
    if (replaying) return;   // one refresh happens at replay_end instead
    try {
      const url = sessionThreadId
        ? "/api/files?thread_id=" + encodeURIComponent(sessionThreadId)
        : "/api/files";
      const res = await fetch(url);
      const items = await res.json();
      if (!items.length) { treeEl.innerHTML = `<div class="ft-empty">${lang.filesEmpty}</div>`; return; }
      treeEl.innerHTML = "";
      for (const it of items) {
        const div = document.createElement("div");
        div.className = it.type === "dir" ? "ft-dir" : "ft-file";
        div.style.paddingLeft = (it.depth * 14) + "px";
        div.textContent = (it.type === "dir" ? "📂 " : "📄 ") + it.path.split("/").pop();
        treeEl.appendChild(div);
      }
    } catch (e) { /* abaikan */ }
  }

  function clearPanes() {
    document.querySelectorAll(".pane").forEach(p => { p.innerHTML = ""; });
    document.querySelectorAll(".tab").forEach(t => {
      t.classList.remove("unread", "busy");
      const badge = t.querySelector(".badge");
      if (badge) badge.textContent = "0";
    });
    liveTotals = {};
  }

  async function loadSessions() {
    try {
      const res = await fetch("/api/sessions");
      const items = await res.json();
      pickerEl.innerHTML = "";
      for (const s of items) {
        const opt = document.createElement("option");
        opt.value = s.thread_id;
        opt.textContent = s.title || lang.untitled;
        if (s.thread_id === currentThreadId) opt.selected = true;
        pickerEl.appendChild(opt);
      }
      pickerEl.style.display = items.length ? "" : "none";
    } catch (e) { /* ignore */ }
  }

  function handleEvent(msg) {
    const agent = msg.agent || "pm";
    switch (msg.type) {
      case "session":
        sessionThreadId = msg.thread_id;
        currentThreadId = msg.thread_id;
        localStorage.setItem(TID_KEY, msg.thread_id);
        clearPanes();
        setMetricsBase(msg.metrics || {});
        loadSessions();
        refreshFiles();
        break;
      case "replay_start":
        replaying = true;
        break;
      case "replay_end":
        replaying = false;
        setStatus("online", lang.restored);
        refreshFiles();
        break;
      case "user":
        addMsg("pm", "user", msg.content);
        break;
      case "awaiting":
        setStatus("question", lang.waitingAnswer);
        setBusy(false);
        switchTab("pm");
        break;
      case "language":
        applyLanguage(msg.code);
        break;
      case "retry":
        addActivity(agent, "call", "🔁 " + (msg.content || lang.retry));
        markBusy(agent);
        break;
      case "working":
        setStatus("working", lang.teamWorking);
        markBusy("pm");
        startElapsed();
        break;
      case "metrics":
        renderMetrics(msg.totals);
        break;
      case "msg":
        addMsg(agent, "agent", msg.content);
        markBusy(agent);
        break;
      case "task":
        addMsg(agent, "task", msg.content, lang.labelTask);
        markBusy(agent);
        break;
      case "peer_in": {
        const from = agentsInfo[msg.from] || { name: msg.from, emoji: "💬" };
        addMsg(agent, "peer-in", msg.content, lang.labelPeerIn(`${from.emoji} ${from.name}`));
        markBusy(agent);
        break;
      }
      case "peer_reply": {
        const from = agentsInfo[msg.from] || { name: msg.from, emoji: "💬" };
        addMsg(agent, "peer-reply", msg.content, lang.labelPeerReply(`${from.emoji} ${from.name}`));
        markBusy(agent);
        break;
      }
      case "report":
        addMsg("pm", "report", msg.content, lang.labelReport);
        markBusy("pm");
        refreshFiles();
        break;
      case "question":
        addMsg("pm", "question", msg.content, lang.labelQuestion);
        setStatus("question", lang.waitingAnswer);
        markBusy(null);
        setBusy(false);
        stopElapsed();   // time spent waiting on the user is not the team's runtime
        switchTab("pm");
        refreshFiles();
        break;
      case "tool_call":
        addActivity(agent, "call", "⚙️ " + renderAction(msg.detail, msg.name));
        markBusy(agent);
        break;
      case "tool_result":
        addActivity(agent, msg.ok ? "ok" : "fail",
          (msg.ok ? "✓ " : "✗ ") + msg.name + ": " + (msg.content || "").split("\n")[0]);
        refreshFiles();
        break;
      case "error":
        addMsg("pm", "error", lang.errorPrefix + msg.content);
        break;
      case "done":
        setStatus("online", lang.ready);
        markBusy(null);
        setBusy(false);
        stopElapsed();
        refreshFiles();
        loadSessions();   // the session title may have just been set from the first message
        break;
    }
  }

  function connect() {
    clearTimeout(reconnectTimer);
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    // Ask the server to resume our saved session; it mints a new one if this is our first.
    const query = currentThreadId ? "?thread_id=" + encodeURIComponent(currentThreadId) : "";
    ws = new WebSocket(proto + "//" + location.host + "/ws" + query);
    ws.onopen = () => { setStatus("online", lang.ready); setBusy(false); };
    ws.onclose = () => {
      replaying = false;
      setStatus("", lang.disconnected);
      setBusy(true);
      reconnectTimer = setTimeout(connect, 2000);
    };
    ws.onmessage = (ev) => handleEvent(JSON.parse(ev.data));
  }

  /** Switch to another saved session, or start a fresh one when threadId is null. */
  function switchSession(threadId) {
    if (threadId) localStorage.setItem(TID_KEY, threadId);
    else localStorage.removeItem(TID_KEY);
    currentThreadId = threadId;
    replaying = false;
    clearPanes();
    setMetricsBase({});
    stopElapsed();
    switchTab("pm");
    if (ws) { ws.onclose = null; try { ws.close(); } catch (e) { /* ignore */ } }
    connect();
  }

  function send() {
    const text = inputEl.value.trim();
    if (!text || busy || !ws || ws.readyState !== WebSocket.OPEN) return;
    addMsg("pm", "user", text);
    switchTab("pm");
    ws.send(JSON.stringify({ content: text }));
    inputEl.value = "";
    inputEl.style.height = "auto";
    setBusy(true);
  }

  sendEl.addEventListener("click", send);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
  });
  newSessionEl.addEventListener("click", () => switchSession(null));
  pickerEl.addEventListener("change", () => {
    if (pickerEl.value && pickerEl.value !== currentThreadId) switchSession(pickerEl.value);
  });

  (async () => {
    applyLanguage("id");
    setStatus("", lang.connecting);
    const res = await fetch("/api/agents");
    buildTabs(await res.json());
    await loadSessions();
    connect();
  })();
</script>
</body>
</html>
