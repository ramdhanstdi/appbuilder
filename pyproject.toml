[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "workspace", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    # Tools return failure strings instead of raising, so broad excepts are deliberate.
    "B904",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into module internals on purpose, and conftest pins env before importing app.
"tests/*" = ["E402"]
